[build-system]
requires = ["maturin>=1.11,<2.0"]
build-backend = "maturin"

[project]
name = "bayesld"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "arviz>=0.23.4",
    "arviz-base>=0.3.0",
    "arviz-plots>=0.3.0",
    "arviz-stats>=0.3.0",
    "cmdstanpy>=1.3.0",
    "cyvcf2>=0.32.1",
    "dill>=0.4.1",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "jax>=0.4.13",
    "joblib>=1.0.0",
    "msprime>=1.4.0",
    "numpy",
    "tqdm>=4.67.1",
    "tskit>=0.5.7",
    "xarray>=2024.9.0",
]
[project.scripts]
vcfbayesld = "bayesld._cli:main"

[project.optional-dependencies]
tests = [
    "pytest",
    "jupytext>=1.19.4",
    "msprime>=1.0",
]
[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow",
]

[tool.ruff]
extend-exclude = ["*.ipynb", "manuscript", "benches"]

[tool.mypy]
files = ["python/bayesld"]

[[tool.mypy.overrides]]
module = ["bayesld.bayesld", "msprime.*", "cyvcf2.*", "tskit.*", "arviz.*", "cmdstanpy.*", "joblib.*", "tqdm.*"]
ignore_missing_imports = true

[tool.uv]
package = true

[tool.maturin]
python-source = "python"
include = [
    { path = "python/bayesld/stan/**", format = "sdist" },
    { path = "python/bayesld/stan/**", format = "wheel" },
    { path = "python/bayesld/inference/stan/**/*.stan", format = "sdist" },
    { path = "python/bayesld/inference/stan/**/*.stan", format = "wheel" },
]

[dependency-groups]
dev = [
    "demesdraw>=0.4.1",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.3.8",
    "jupytext>=1.16.0",
    "marimo>=0.8.22",
    "seaborn>=0.13.2",
]
